license = "MIT"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Nico Welles"
description = "Buffs flying with an elytra: crouch to cold start into the air with one mighty wing beat, flap the wings in flight for extra speed, and regain more speed from diving, so a flight can go on forever."
${icon}File = "assets/${id}/icon.png"
# pixel art, scaled without smoothing
${icon}Blur = false

[[mixins]]
config = "elytrabuff.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
